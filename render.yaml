services:
  - type: web
    name: multi-workspace-doc-assistant
    runtime: docker
    plan: free
    region: singapore   # same region as the Neon database
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false   # set in the Render dashboard; never committed
      - key: JWT_SECRET
        generateValue: true   # Render generates a random secret; never committed
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
